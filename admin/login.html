
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Uzbek Prompts</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #f5f6fa;
      color: #171923;
      font-family: Inter, Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 36px;
      background: white;
      border: 1px solid #e8e9ef;
      border-radius: 20px;
      box-shadow: 0 20px 60px #2024400d;
    }
    .logo {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: #171923;
      color: white;
      font-size: 24px;
      font-weight: 800;
    }
    .eyebrow {
      margin-top: 24px;
      color: #6654ed;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
    }
    h1 { margin: 8px 0; font-size: 29px; }
    .sub { color: #737789; line-height: 1.6; font-size: 14px; }
    label {
      display: block;
      margin-top: 20px;
      font-size: 13px;
      font-weight: 700;
    }
    input {
      width: 100%;
      margin-top: 8px;
      padding: 13px 14px;
      border: 1px solid #dfe1e9;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
    }
    input:focus {
      border-color: #7563f6;
      box-shadow: 0 0 0 3px #7563f620;
    }
    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #6855ee;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .65; cursor: wait; }
    #message { min-height: 20px; margin-top: 14px; font-size: 13px; color: #c0394b; }
    .back { display: block; margin-top: 12px; text-align: center; color: #737789; font-size: 13px; text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">U</div>
    <div class="eyebrow">ADMIN CONSOLE</div>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to manage the Uzbek Prompts platform.</p>

    <form id="loginForm">
      <label for="email">Admin email</label>
      <input id="email" type="email" placeholder="Enter admin email"
             autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Enter password"
             autocomplete="current-password" required>

      <button id="submitButton" type="submit">Log In</button>
      <div id="message" role="status"></div>
    </form>

    <a class="back" href="/">← Back to website</a>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const button = document.getElementById("submitButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";
      button.disabled = true;
      button.textContent = "Signing in...";

      try {
        const response = await fetch("/api/auth/admin-login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value
          })
        });

        const data = await response.json();

        if (!response.ok || !data.token) {
          throw new Error(data.message || "Invalid email or password.");
        }

        localStorage.setItem("up_admin_token", data.token);
        localStorage.setItem("up_token", data.token);

        if (data.user) {
          localStorage.setItem("up_user", JSON.stringify(data.user));
        }

        window.location.href = "/admin/";
      } catch (error) {
        message.textContent =
          error.message || "Unable to connect to the server.";
      } finally {
        button.disabled = false;
        button.textContent = "Log In";
      }
    });
  </script>
</body>
</html>
